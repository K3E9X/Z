[project]
name = "z-common"
version = "0.1.0"
description = "Z shared models generated from contracts/, contract validation and pack lint"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "referencing>=0.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/z_common"]
