[project]
name = "z-runner"
version = "0.1.0"
description = "Z runner: runs one agent job (AgentBackend, OpenHands backend, guardrails)"
requires-python = ">=3.12"
dependencies = [
  "z-common",
  "httpx>=0.27",
]

[project.scripts]
z-runner = "z_runner.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/z_runner"]
