[project]
name = "z-runner"
version = "0.1.0"
description = "Z runner: runs one agent job (AgentBackend, OpenHands backend, guardrails)"
requires-python = ">=3.12"
dependencies = [
  "z-common",
  "httpx>=0.27",
  "openhands-sdk==1.56.0",
  "openhands-tools==1.56.0",
  "jsonschema>=4.23",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "anyio>=4.6",
  "mcp>=1.30,<2",
  # documents and code tools (docs/04 §2): office formats, PDF, analysis and charts
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "reportlab>=4.2",
  "python-pptx>=1.0",
  "pandas>=2.2",
  "matplotlib>=3.9",
]

[project.scripts]
z-runner = "z_runner.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/z_runner"]
