# Microsoft 365 through Microsoft Graph. Two Entra app registrations keep read and write apart:
#   z-m365-read  -> read scopes, tokens held by the gateway
#   z-m365-write -> write scopes, tokens held by the executor only
# Each person consents to both from Settings > Connections. Verify scope names and protected-API rules in the Graph docs.
name: m365
kind: openapi
display_name: Microsoft 365
base_url: https://graph.microsoft.com/v1.0
spec: ./microsoft-graph.openapi.json    # the Graph v1.0 subset this pack uses (operationIds = Z operation ids)
oauth:
  tenant_id: <entra-tenant-id>
  read_app:  { client_id: <z-m365-read-client-id>,  secret: vault:z/m365/read-client-secret }
  write_app: { client_id: <z-m365-write-client-id>, secret: vault:z/m365/write-client-secret }
auth:
  read:
    user:    { flow: authorization_code_pkce, app: read_app, scopes: [Mail.Read, Calendars.Read, Chat.Read, ChannelMessage.Read.All, Files.Read.All, OnlineMeetingTranscript.Read.All] }
    service: { flow: client_credentials, app: read_app }    # shared mailboxes, channels, sites; scope with Exchange RBAC for Applications / RSC
  write:
    user:    { flow: authorization_code_pkce, app: write_app, scopes: [Mail.Send, Calendars.ReadWrite, ChatMessage.Send, ChannelMessage.Send, Files.ReadWrite] }
    service: { flow: client_credentials, app: write_app }
operations:
  default_exposed: false
  rules:
    - { match: "mail.list", class: read, exposed: true }
    - { match: "mail.get", class: read, exposed: true }
    - { match: "calendar.events.list", class: read, exposed: true }
    - { match: "teams.messages.list", class: read, exposed: true }
    - { match: "teams.transcripts.get", class: read, exposed: true }
    - { match: "files.get", class: read, exposed: true }
    - { match: "mail.send", class: write, exposed: true }
    - { match: "mail.reply", class: write, exposed: true }
    - { match: "calendar.events.create", class: write, exposed: true }
    - { match: "teams.messages.post", class: write, exposed: true }
    - { match: "mail.delete", class: destructive, exposed: false }
data_class: C2
