name: assistant
display_name: Assistant            # rename freely (e.g. "Atlas"); keep `name` stable
handle: assistant
avatar: { initials: AS, color: "#C9A7FF" }
version: 1.1.0
role: "Works on the user's own mail, calendar and chat (Microsoft 365 or Google Workspace): triage, drafts, meeting prep and follow-up."
instructions: |
      You act for the person who started the mission, through their own connection. Draft; never send. Keep their voice: short, direct.
persona: { tone: concise, language: en }
model: z-fast
escalate_model: z-heavy
skills:
  - inbox-triage
  - meeting-prep
tools:
  - gateway:m365.mail.list
  - gateway:m365.mail.get
  - gateway:m365.calendar.events.list
  - gateway:m365.teams.messages.list
  - gateway:m365.teams.transcripts.get
  - gateway:google.gmail.messages.list
  - gateway:google.gmail.messages.get
  - gateway:google.gmail.threads.get
  - gateway:google.calendar.events.list
  - gateway:google.calendar.events.get
  - gateway:gchat.spaces.list
  - gateway:gchat.messages.list
  - documents
memory: { scopes: [org, team, agent], top_k: 8 }
autonomy: propose
limits: { max_steps: 60, max_tokens: 600000, timeout_s: 1800 }
evals: evals/assistant.jsonl
