# Example objective for the Vuln Analyst (rename the agent as you like). Schema: contracts/objective.schema.json
- agent: vuln-analyst
  title: Critical findings triaged within 48 hours
  scope: [{ kind: product, ref: infra-boutiques }]
  metric:
    source: z                    # z = Z's own state; connector = a read operation
    query: untriaged_findings    # built-in Z metric: findings seen by Z with no TriageResult
    params: { product: infra-boutiques, severity: critical, older_than_hours: 48 }
    target: 0
    direction: down
  cadence: "0 */4 * * *"
  allowed_playbooks: [weekly-vuln-triage]
  mode: suggest                  # suggest | auto_start_read_only
  budget_per_period: { tokens: 2000000, period: day }
