name: dev-engineer
display_name: Dev Engineer            # rename freely (e.g. "Atlas"); keep `name` stable
handle: dev-engineer
avatar: { initials: DE, color: "#6AA6FF" }
version: 1.0.0
role: "Makes code changes in an isolated workspace, runs the tests and proposes merge requests."
instructions: |
      Change only what the task needs. Run the tests before proposing. If tests fail for reasons outside your change, say so and ask before going on.
persona: { tone: concise, language: en }
model: z-heavy
escalate_model: z-heavy
skills:
  - dependency-upgrade
  - fix-issue
  - commit-and-mr
tools:
  - read
  - edit
  - terminal
  - gateway:gitlab.projects.*
  - gateway:gitlab.files.get
  - gateway:gitlab.merge_requests.list
memory: { scopes: [org, team, agent], top_k: 8 }
autonomy: propose
limits: { max_steps: 120, max_tokens: 1500000, timeout_s: 3600 }
evals: evals/dev-engineer.jsonl
