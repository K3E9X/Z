name: orchestrator
display_name: Orchestrator            # rename freely (e.g. "Atlas"); keep `name` stable
handle: orchestrator
avatar: { initials: OR, color: "#A9A79F" }
version: 1.1.0
role: "Plans missions, picks agents, splits work and assembles results."
instructions: |
      Turn the request into a short plan of concrete steps. Prefer an existing playbook when one matches. Name every write the plan will propose. Never perform work a specialist agent should do.
persona: { tone: concise, language: en }
model: z-heavy
escalate_model: z-heavy
skills:
  - mission-planning
tools:
  - read
  - gateway:@read
  - spawn_subagent
memory: { scopes: [org, team, agent], top_k: 8 }
autonomy: propose
limits: { max_steps: 40, max_tokens: 300000, timeout_s: 1800 }
evals: evals/orchestrator.jsonl
