name: jira
kind: mcp                       # or openapi with the Jira REST spec
display_name: Jira
mcp: { transport: stdio, command: "<jira-mcp-server command>" }
operation_map:
  jira_search: issues.search
  jira_get_issue: issues.get
  jira_create_issue: issues.create
  jira_update_issue: issues.update
  jira_add_comment: comments.create
  jira_delete_issue: issues.delete
auth:
  read:  { type: bearer, secret: env:JIRA_TOKEN_RO }
  write: { type: bearer, secret: env:JIRA_TOKEN_RW }
operations:
  default_exposed: false
  rules:
    - { match: "issues.search", class: read, exposed: true }
    - { match: "issues.get", class: read, exposed: true }
    - { match: "issues.create", class: write, exposed: true }
    - { match: "issues.update", class: write, exposed: true }
    - { match: "comments.create", class: write, exposed: true }
    - { match: "issues.delete", class: destructive, exposed: false }
data_class: C2
