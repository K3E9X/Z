# Internal tool. Replace logos.openapi.json with its real OpenAPI document, or switch kind to `browser` and record flows.
name: logos
kind: openapi
display_name: Logos
base_url: ${LOGOS_URL}
spec: ./logos.openapi.json
operation_ids: from_operation_id    # canonical id = slug of the OpenAPI operationId (fallback: method + path)
auth:
  read:  { type: bearer, secret: env:LOGOS_TOKEN_RO }
  write: { type: bearer, secret: env:LOGOS_TOKEN_RW }
operations:
  default_exposed: false
  rules:
    - { match: "assets.get", class: read, exposed: true }
    - { match: "accounts.list", class: read, exposed: true }
    - { match: "accounts.disable", class: destructive, exposed: true }   # proposable, always two approvers
    - { match: "accounts.delete", class: destructive, exposed: false }
rate_limit: { per_minute: 60 }
data_class: C2
