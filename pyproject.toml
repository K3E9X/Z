[project]
name = "z-workspace"
version = "0.1.0"
description = "Z monorepo (workspace root, not a package)"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-pyyaml",
  "types-jsonschema",
  "httpx>=0.27",
  "openapi-spec-validator>=0.7",
  # fakes (tests/fakes): scriptable LLM, tools, Prometheus and GitLab OIDC
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "mcp>=1.20",
  "pyjwt[crypto]>=2.9",
  "dulwich>=0.22",            # fake GitLab git smart-HTTP
  "sse-starlette>=2.1",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
]

[tool.uv]
package = false
# Release age gate (docs/13 §3): never resolve a release younger than 7 days.
exclude-newer = "7 days"
# LiteLLM (pulled in as a library by the OpenHands SDK in the runner) waits 14 days (docs/13 §3).
exclude-newer-package = { litellm = "14 days" }
# Never installed: a closed binary under the Laminar terms of service, pulled in by openhands-sdk -> lmnr and only
# imported by Laminar's Claude-agent instrumentation, which Z never enables (the runner strips LMNR_* env).
exclude-dependencies = ["lmnr-claude-code-proxy"]

[tool.uv.workspace]
members = ["packages/z-common", "server", "runner", "cli", "browser"]

[tool.uv.sources]
z-common = { workspace = true }
z-server = { workspace = true }
z-runner = { workspace = true }
z-cli = { workspace = true }
z-browser = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["ui", "design", "poc", "docs", "*.md", "**/alembic/versions", ".claude", "packs/*/evals/fixtures"]  # fixtures: sample code agents fix, data

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF"]
ignore = ["S101", "RUF012", "E501"]  # E501: the formatter owns line length

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B011"]
"tests/**" = ["S", "B011"]
"contracts/tools/**" = ["B007", "E731", "C408", "RUF005", "SIM", "B023", "E741"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = ["packages/z-common/src", "server/src", "runner/src", "cli/src", "browser/src"]
explicit_package_bases = true
exclude = ["/tests/", "^tests/", "alembic/versions"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "docker.*", "kubernetes.*", "openhands.*", "sse_starlette.*", "argon2.*", "pyotp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages/z-common/tests", "server/tests", "runner/tests", "cli/tests", "browser/tests", "tests/unit"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --import-mode=importlib"
pythonpath = ["."]
markers = [
  "db: needs a Postgres database (DATABASE_URL or testcontainers)",
  "e2e: end-to-end against a running compose stack",
]

[tool.coverage.run]
branch = true
concurrency = ["greenlet", "thread"]
omit = ["*/alembic/versions/*", "*/tests/*"]
