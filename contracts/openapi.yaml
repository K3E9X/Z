# Z API contract (OpenAPI 3.1). Frozen at tag contracts-v1; changes go through the main session only.
openapi: 3.1.0
info:
  title: Z API
  version: 1.0.0
  description: 'Public and internal API of z-server. Everything under /api/v1 (see servers). JSON, cursor pagination ({items, next_cursor} with ?cursor=&limit=), errors as RFC 9457 problem details. Every
    operation declares x-permission (deny by default, contracts/permissions.yaml), x-owner (BUILD workstream), x-audit (writes an audit event in the same transaction) and x-step-up (needs a re-authentication
    within auth.step_up_max_age_s). Browser clients use the __Host-z_session cookie and send the __Host-z_csrf cookie value in X-CSRF-Token on state-changing requests; CLI and scripts use Authorization:
    Bearer <Z CLI or API token>. Runners use Authorization: Bearer <job token>. Out of /api/v1: GET /healthz, GET /readyz, GET /metrics (Prometheus), /mcp (Z as an MCP server: start_mission, get_mission,
    list_playbooks, list_review) and /gateway/mcp (per-job tool gateway, MCP streamable HTTP).'
servers:
- url: /api/v1
tags:
- name: auth
- name: missions
- name: jobs
- name: review
- name: agents
- name: skills
- name: objectives
- name: playbooks
- name: tasks
- name: sessions
- name: connectors
- name: channels
- name: inference
- name: learning
- name: history
- name: admin
- name: docs
- name: live
- name: internal
security:
- session: []
- bearer: []
paths:
  /auth/login:
    get:
      operationId: authLogin
      tags:
      - auth
      summary: Start GitLab sign-in (redirect)
      x-permission: public
      x-owner: B1
      description: '302 to GitLab authorize with PKCE, state and nonce. Clients that cannot follow redirects get the URL as JSON with Accept: application/json.'
      parameters:
      - name: redirect
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginRedirect'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
  /auth/callback:
    get:
      operationId: authCallback
      tags:
      - auth
      summary: OIDC callback
      x-permission: public
      x-owner: B1
      x-audit: true
      description: Validates state, code_verifier, ID token (iss, aud, signature via JWKS, exp, nonce), reads userinfo groups, provisions the user, maps roles and teams, opens a session, sets __Host-z_session
        and __Host-z_csrf cookies, redirects to the UI.
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: error
        in: query
        required: false
        schema:
          type: string
      responses:
        '302':
          description: Done
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
  /auth/logout:
    post:
      operationId: authLogout
      tags:
      - auth
      summary: Sign out
      x-permission: authenticated
      x-owner: B1
      x-audit: true
      responses:
        '204':
          description: Done
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/step-up:
    post:
      operationId: authStepUp
      tags:
      - auth
      summary: Start step-up re-authentication
      x-permission: authenticated
      x-owner: B1
      x-audit: true
      description: 'GitLab users: returns the OIDC URL (prompt=login + max_age). Local accounts: password (and TOTP for break-glass) in the body, step-up is immediate.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                return_to: &id001
                  type: string
                password:
                  type: string
                  description: 'Local accounts: re-enter the password.'
                totp:
                  type: string
                  description: 'Break-glass: current TOTP code.'
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpResponse'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/cli/config:
    get:
      operationId: authCliConfig
      tags:
      - auth
      summary: OAuth settings for the CLI
      x-permission: public
      x-owner: B1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliAuthConfig'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
  /auth/cli/exchange:
    post:
      operationId: authCliExchange
      tags:
      - auth
      summary: Exchange a GitLab token for a Z CLI token
      x-permission: public
      x-owner: B1
      x-audit: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CliExchangeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliToken'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
  /auth/local/login:
    post:
      operationId: authLocalLogin
      tags:
      - auth
      summary: Sign in with a local account (bootstrap, test, break-glass)
      x-permission: public
      x-owner: B1
      x-audit: true
      description: Off by default; argon2id; rate-limited; locked after 5 failures; always audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalLoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
  /me:
    get:
      operationId: getMe
      tags:
      - auth
      summary: Current user, effective permissions and session
      x-permission: authenticated
      x-owner: B1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /me/sessions:
    get:
      operationId: listMySessions
      tags:
      - auth
      summary: My web sessions and CLI tokens
      x-permission: authenticated
      x-owner: B1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthSession'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /me/sessions/{id}:
    delete:
      operationId: revokeMySession
      tags:
      - auth
      summary: Revoke one of my sessions
      x-permission: authenticated
      x-owner: B1
      x-audit: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Done
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /me/notifications:
    get:
      operationId: getMyNotifications
      tags:
      - auth
      summary: My notification preferences
      x-permission: authenticated
      x-owner: B1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyNotifications'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      operationId: putMyNotifications
      tags:
      - auth
      summary: Change my notification preferences
      x-permission: authenticated
      x-owner: B1
      x-audit: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyNotifications'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyNotifications'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /me/tokens:
    get:
      operationId: listMyTokens
      tags:
      - auth
      summary: My API tokens
      x-permission: authenticated
      x-owner: B1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiToken'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createMyToken
      tags:
      - auth
      summary: Create an API token (shown once)
      x-permission: authenticated
      x-owner: B1
      x-audit: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenCreate'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiToken'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /me/tokens/{id}:
    delete:
      operationId: revokeMyToken
      tags:
      - auth
      summary: Revoke an API token
      x-permission: authenticated
      x-owner: B1
      x-audit: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Done
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /missions:
    post:
      operationId: createMission
      tags:
      - missions
      summary: Create (and by default start) a mission
      x-permission: missions:start
      x-owner: B1
      x-audit: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionCreate'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      operationId: listMissions
      tags:
      - missions
      summary: List missions
      x-permission: missions:read
      x-owner: B1
      parameters:
      - name: cursor
        in: query
        required: false
        schema: &id002
          type: string
      - name: limit
        in: query
        required: false
        schema: &id003
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: playbook
        in: query
        required: false
        schema:
          type: string
      - name: agent
        in: query
        required: false
        schema:
          type: string
      - name: created_by
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Mission'
                  next_cursor:
                    oneOf:
                    - *id001
                    - type: 'null'
                required:
                - items
                - next_cursor
                additionalProperties: false
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /missions/draft-plan:
    post:
      operationId: draftPlan
      tags:
      - missions
      summary: Draft a plan for a free-form request
      x-permission: missions:start
      x-owner: B1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftPlanRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftPlan'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /missions/{id}:
    get:
      operationId: getMission
      tags:
      - missions
      summary: Get a mission
      x-permission: missions:read
      x-owner: B1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /missions/{id}/plan:
    patch:
      operationId: patchMissionPlan
      tags:
      - missions
      summary: Edit the plan before start (plan mode)
      x-permission: missions:start
      x-owner: B1
      x-audit: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /missions/{id}/start:
    post:
      operationId: startMission
      tags:
      - missions
      summary: Start a mission
      x-permission: missions:start
      x-owner: B1
      x-audit: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionControl'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /missions/{id}/pause:
    post:
      operationId: pauseMission
      tags:
      - missions
      summary: Pause a mission
      x-permission: missions:control
      x-owner: B1
      x-audit: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionControl'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /missions/{id}/resume:
    post:
      operationId: resumeMission
      tags:
      - missions
      summary: Resume a mission
      x-permission: missions:control
      x-owner: B1
      x-audit: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionControl'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /missions/{id}/cancel:
    post:
      operationId: cancelMission
      tags:
      - missions
      summary: Cancel a mission
      x-permission: missions:control
      x-owner: B1
      x-audit: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionControl'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /missions/{id}/messages:
    post:
      operationId: guideMission
      tags:
      - missions
      summary: Guide the agent
      x-permission: missions:control
      x-owner: B1
      x-audit: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuideMessage'
      responses:
        '202':
          description: Done
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /missions/{id}/take-over:
    post:
      operationId: takeOverMission
      tags:
      - missions
      summary: Pause and open the workspace
      x-permission: missions:control
      x-owner: B1
      x-audit: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TakeOver'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TakeOverSession'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /missions/{id}/take-over/{job_id}/files:
    get:
      operationId: getTakeOverWorkspace
      tags:
      - missions
      summary: Files of a workspace being taken over
      x-permission: missions:control
      x-owner: B1
      description: The paused workspace rebuilt from its staged inputs and the job checkpoint, with the edits of this take-over. Only the person who took it over, while the session lasts.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TakeOverWorkspace'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /missions/{id}/take-over/{job_id}/file:
    get:
      operationId: getTakeOverFile
      tags:
      - missions
      summary: Read one file of a workspace being taken over
      x-permission: missions:control
      x-owner: B1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TakeOverFileContent'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      operationId: putTakeOverFile
      tags:
      - missions
      summary: Write one file (read_write take-over)
      x-permission: missions:control
      x-owner: B1
      x-audit: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TakeOverEdit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TakeOverFile'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: deleteTakeOverFile
      tags:
      - missions
      summary: Delete one file (read_write take-over)
      x-permission: missions:control
      x-owner: B1
      x-audit: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: query
        required: false
        schema:
          type: string
      responses:
        '204':
          description: Done
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /missions/{id}/take-over/{job_id}/finish:
    post:
      operationId: finishTakeOver
      tags:
      - missions
      summary: End a take-over
      x-permission: missions:control
      x-owner: B1
      x-audit: true
      description: Edits are folded into the job checkpoint and the job restarts from it (the agent is told which files a person changed); without edits the job simply resumes. resume=false keeps it paused.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TakeOverFinish'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TakeOverResult'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /missions/{id}/events:
    get:
      operationId: streamMissionEvents
      tags:
      - missions
      summary: Mission event stream (SSE)
      x-permission: missions:read
      x-owner: B1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: after_seq
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: 'Server-sent events: `id` = seq (send Last-Event-ID to resume), `event` = type, `data` = JSON.'
          content:
            text/event-stream:
              schema:
                $ref: events.schema.json
        '204':
          description: 'Nothing more will come (the mission has ended and every event after Last-Event-ID was sent): do not reconnect.'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /missions/{id}/files:
    post:
      operationId: uploadMissionFile
      tags:
      - missions
      summary: Upload an input file before start (workspace files)
      x-permission: missions:start
      x-owner: B1
      x-audit: true
      description: Only while the mission is draft or planned. Files land in the job workspace (mode files) as /workspace/<name>, after the judge scan of staged inputs.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
