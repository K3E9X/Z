# ZAP baseline rules for the e2e job (zap-baseline.py -c). Tab-separated: rule id, WARN | FAIL | IGNORE, note.
# FAIL: what the z-ui nginx and z-server must always send (docs/07 security headers, cookie flags).
10020	FAIL	Anti-clickjacking header (X-Frame-Options / CSP frame-ancestors)
10021	FAIL	X-Content-Type-Options header missing
10038	FAIL	Content Security Policy header not set
10063	FAIL	Permissions Policy header not set
10010	FAIL	Cookie without HttpOnly flag
10054	FAIL	Cookie without SameSite attribute
10011	WARN	Cookie without Secure flag (the e2e stack is plain HTTP; production is HTTPS only)
10035	WARN	Strict-Transport-Security (set by the TLS ingress, not in the plain-HTTP e2e stack)
10096	IGNORE	Timestamp disclosure (hashed asset names and API timestamps)
10109	IGNORE	Modern web application (informational)
