# End-to-end (docs/13 §1 "e2e"): the compose stack with the fake LLM, fake tools and fake GitLab OIDC
# (tests/e2e/compose.fakes.yml + compose.e2e.yml), images built locally, then `pytest -m e2e tests/e2e`.
# Runs on PRs that touch the server, runner, deploy or e2e code, and on main. No secrets: the stack's
# passwords are random per run. ZAP baseline and kind/k3d smoke tests are added when their scripts exist.
name: e2e
on:
  pull_request:
    paths:
      - "server/**"
      - "runner/**"
      - "browser/**"
      - "packages/**"
      - "deploy/**"
      - "config/**"
      - "tests/e2e/**"
      - "tests/fakes/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_FILES: -f docker-compose.yml -f ../../tests/e2e/compose.fakes.yml -f ../../tests/e2e/compose.e2e.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with: { version: "0.13.4" }
      - run: uv sync --frozen --all-packages
      - name: Configuration with random per-run secrets
        run: |
          cp .env.example .env
          cp config/litellm.example.yaml config/litellm.yaml
          cp config/z.example.yaml config/z.yaml
          rand() { openssl rand -hex 24; }
          {
            echo "POSTGRES_PASSWORD=$(rand)"
            echo "Z_APP_DB_PASSWORD=$(rand)"
            echo "LITELLM_MASTER_KEY=sk-$(rand)"
            echo "Z_SECRET_KEY=$(rand)$(rand)"
            echo "Z_METRICS_TOKEN=$(rand)"
          } >> .env
      - name: Build the runner image (started by z-server through the socket proxy, not by compose)
        run: docker build -t z-runner:local -f deploy/images/z-runner/Dockerfile .
      - name: Start the stack
        working-directory: deploy/compose
        run: |
          # shellcheck disable=SC2086 # COMPOSE_FILES holds several -f flags
          DOCKER_GID=$(stat -c %g /var/run/docker.sock) \
            docker compose --env-file ../../.env $COMPOSE_FILES up -d --build --wait --wait-timeout 600
      - name: pytest -m e2e
        run: uv run pytest -m e2e tests/e2e -v
      - name: Compose logs
        if: failure()
        working-directory: deploy/compose
        run: |
          # shellcheck disable=SC2086
          docker compose --env-file ../../.env $COMPOSE_FILES logs --no-color --tail 400
      - name: Stop the stack
        if: always()
        working-directory: deploy/compose
        run: |
          # shellcheck disable=SC2086
          docker compose --env-file ../../.env $COMPOSE_FILES down -v --remove-orphans
