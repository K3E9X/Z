{{- if and (not .Values.secrets.existingSecret) (not .Values.secrets.externalSecret.enabled) }}
{{- $name := include "z.secretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "z.labels" . | nindent 4 }}
  annotations:
    # Z_SECRET_KEY seals data in the database: never lose it with an uninstall.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  Z_SECRET_KEY: {{ include "z.keptSecretValue" (dict "root" . "secret" $name "key" "Z_SECRET_KEY" "value" .Values.secrets.zSecretKey "length" 64) | quote }}
  LITELLM_MASTER_KEY: {{ include "z.keptSecretValue" (dict "root" . "secret" $name "key" "LITELLM_MASTER_KEY" "value" .Values.secrets.litellmMasterKey "length" 48 "prefix" "sk-") | quote }}
  {{- with .Values.secrets.oidcClientSecret }}
  OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.inferenceApiKey }}
  INFERENCE_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
---
{{- if and .Values.postgres.embedded (not .Values.database.existingSecret) }}
{{- $name := include "z.dbSecretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "z.labels" . | nindent 4 }}
  annotations:
    # The passwords live in the Postgres volume as well: keep them with it.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ include "z.keptSecretValue" (dict "root" . "secret" $name "key" "POSTGRES_PASSWORD" "value" "" "length" 40) | quote }}
  Z_APP_DB_PASSWORD: {{ include "z.keptSecretValue" (dict "root" . "secret" $name "key" "Z_APP_DB_PASSWORD" "value" "" "length" 40) | quote }}
  LITELLM_DB_PASSWORD: {{ include "z.keptSecretValue" (dict "root" . "secret" $name "key" "LITELLM_DB_PASSWORD" "value" "" "length" 40) | quote }}
{{- end }}
