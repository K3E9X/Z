{{- $r := .Values.runners }}
{{- if $r.networkPolicy.enabled }}
# Runner namespace: deny everything, then allow only DNS and the pods labelled z.io/runner-reachable=true in
# the release namespace (z-server internal API + gateway, LiteLLM). No internet, no Kubernetes API, no
# traffic between runner pods (docs/07 §3, docs/11 §2).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $r.namespace }}
  labels:
    {{- include "z.componentLabels" (dict "root" . "component" "runners") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runners-egress
  namespace: {{ $r.namespace }}
  labels:
    {{- include "z.componentLabels" (dict "root" . "component" "runners") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              z.io/runner-reachable: "true"
      {{- with $r.networkPolicy.reachablePorts }}
      ports:
        {{- range . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
        {{- if $.Values.egressProxy.enabled }}
        - protocol: TCP
          port: {{ $.Values.egressProxy.port }}
        {{- end }}
      {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.dns.podLabels | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- with $r.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
