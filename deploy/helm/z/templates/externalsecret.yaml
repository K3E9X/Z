{{- if .Values.secrets.externalSecret.enabled }}
{{- $es := .Values.secrets.externalSecret }}
# External Secrets Operator writes the Secret <fullname>-secrets (keys Z_SECRET_KEY, LITELLM_MASTER_KEY and
# optionally OIDC_CLIENT_SECRET, INFERENCE_API_KEY) from your secret store.
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "z.secretName" . }}
  labels:
    {{- include "z.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ include "z.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  {{- with $es.data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $es.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
