{{- if .Values.ui.enabled }}
{{- $fullname := include "z.ui.fullname" . }}
# z-ui: the web app on unprivileged nginx (uid 101), proxying /api to z-server.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "z.componentLabels" (dict "root" . "component" "ui") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "z.selectorLabels" (dict "root" . "component" "ui") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ui.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "z.componentLabels" (dict "root" . "component" "ui") | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "z.selectorLabels" (dict "root" . "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "z.selectorLabels" (dict "root" . "component" "ui") | nindent 8 }}
      {{- with .Values.ui.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "z.podSecurityContext" (dict "root" . "uid" 101) | nindent 8 }}
      {{- include "z.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: ui
          image: {{ include "z.image" (dict "image" .Values.ui.image "root" .) }}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.port }}
              protocol: TCP
          env:
            - name: Z_SERVER_UPSTREAM
              value: {{ printf "%s.%s.svc:%v" (include "z.server.fullname" .) .Release.Namespace .Values.server.port | quote }}
            - name: Z_UI_PORT
              value: {{ .Values.ui.port | quote }}
          livenessProbe:
            httpGet: { path: /ui-healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /ui-healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            {{- include "z.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
