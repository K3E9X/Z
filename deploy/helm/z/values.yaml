# Z Helm chart: safe defaults, everything hardened (docs/11 §2, docs/07 §3).
# Overlays: values-k3s.yaml (team server on k3s) and values-k8s.yaml (vanilla Kubernetes). Put site-specific
# values (host, OIDC, image digests, model ids) in your own file:  -f values-k3s.yaml -f my-values.yaml

nameOverride: ""
fullnameOverride: ""

# Z_ENV: production | staging | development. `production` refuses dev auth, the process executor, test
# accounts and runner images without a digest (the server checks this at start and exits with the reason),
# and the chart refuses to render with the network policies off or LiteLLM egress unpinned (README
# "Production checks").
env: production

# Public URL of Z (Z_PUBLIC_URL). Empty: derived from ingress.host (https when ingress.tls.enabled).
publicUrl: ""

# Sign-in (docs/12). The client secret goes in the Secret (secrets.oidcClientSecret or your existing Secret).
oidc:
  issuerUrl: ""            # https://gitlab.example.internal
  clientId: ""
authMode: oidc             # Z_AUTH_MODE: oidc | dev (dev is refused when env=production)

imagePullSecrets: []       # [{name: ghcr-pull}]

# Applied to every pod of the chart (pods override with their own runAsUser where the image needs it).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  fsGroupChangePolicy: OnRootMismatch   # volume ownership fixed once, not on every start
  # The default container type, stated explicitly (CIS 5.7.3); ignored on nodes without SELinux, and the
  # runtime still gives each pod its own MCS level. PSA restricted allows only container_t-like types.
  seLinuxOptions:
    type: container_t

# Applied to every container of the chart (invariant 13). Not configurable per component on purpose.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  runAsNonRoot: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault
  procMount: Default

# The release namespace must enforce Pod Security Admission `restricted` (docs/07 §3), like the runner
# namespace. With `helm install` create and label it before the install (Helm stores the release there before
# it creates resources, so the chart cannot own it):
#   kubectl create namespace z
#   kubectl label namespace z pod-security.kubernetes.io/enforce=restricted pod-security.kubernetes.io/enforce-version=latest \
#     pod-security.kubernetes.io/audit=restricted pod-security.kubernetes.io/warn=restricted
# NOTES.txt warns after install/upgrade when the label is missing.
releaseNamespace:
  # Render the Namespace with the PSA labels (runners.podSecurity), for `helm template | kubectl apply` or
  # Argo CD. Leave false with `helm install` / `helm upgrade` (the Namespace would conflict with the release).
  create: false

# Address ranges of the cluster (defaults: k3s). The egress proxy may never reach them; podCIDR is also the
# default of server.trustedProxies. Other distributions:
# set your own (kubeadm services 10.96.0.0/12; pods per CNI, e.g. Calico 192.168.0.0/16).
cluster:
  podCIDR: 10.42.0.0/16
  serviceCIDR: 10.43.0.0/16

# --------------------------------------------------------------------------------------------------- z-server
server:
  # `all`: api + scheduler + gateway + executor + learner + monitor in one process. Several replicas are safe
  # (the job queue, action executor and intake claim rows with FOR UPDATE SKIP LOCKED), but every replica
  # writes artifacts: with more than one replica, persistence.artifacts needs ReadWriteMany storage.
  replicas: 1
  # Running each component in its own Deployment (docs/11 §2) is not implemented by this chart version.
  # Leave false; true fails the render instead of producing broken Deployments.
  splitComponents: false
  image:
    repository: ghcr.io/k3e9x/z-server
    tag: ""                # default: v<appVersion>. Never `latest`.
    digest: ""             # sha256:... wins over the tag. Always deploy by digest in production.
    pullPolicy: IfNotPresent
  port: 8000
  logLevel: INFO           # Z_LOG_LEVEL
  # Z_TRUSTED_PROXIES: comma-separated addresses/CIDRs whose X-Forwarded-For is trusted (uvicorn
  # forwarded_allow_ips). Empty: cluster.podCIDR, so the audit log and the per-IP sign-in limiter see the
  # client address that z-ui and the ingress controller forward instead of the z-ui pod's. Trade-off: runner
  # pods share the pod CIDR and can reach z-server, so they could forge X-Forwarded-For on their own requests
  # (spoofed audit IP, sign-in attempts counted against another IP). Narrow it to the z-ui / ingress
  # controller addresses when your CNI allows it (e.g. a dedicated node pool's pod range), or set 127.0.0.1
  # to trust no proxy.
  trustedProxies: ""
  # Z_CLUSTER_CIDRS: ranges the SSRF guard treats as cluster-internal. Empty keeps the server default
  # (10.42.0.0/16,10.43.0.0/16,10.96.0.0/12). Set your pod and service CIDRs.
  clusterCIDRs: ""
  # Z_OUTBOUND_ALLOW: host names or CIDRs allowed although they resolve to internal ranges (internal tools).
  outboundAllow: ""
  secretsBackend: kubernetes   # Z_SECRETS_BACKEND: env | file | vault | kubernetes
  inferencePrometheusUrl: ""   # INFERENCE_PROMETHEUS_URL (Inference screen)
  shutdownGraceSeconds: 10     # Z_SHUTDOWN_GRACE_S; terminationGracePeriodSeconds is derived from it
  # Secrets the gateway may read with `kubernetes:<namespace>/<name>#<key>` references (connector
  # credentials). Each entry grants `get` on exactly these Secret names. Empty: no Secret read access.
  secretRefs: []
  #  - namespace: z
  #    names: [gitlab-ro, gitlab-rw]
  resources:
    requests: { cpu: 250m, memory: 512Mi, ephemeral-storage: 256Mi }
    limits: { cpu: "2", memory: 2Gi, ephemeral-storage: 1Gi }
  tmpSizeLimit: 256Mi
  extraEnv: []             # [{name: GITLAB_URL, value: https://gitlab.example.internal}]
  extraEnvFrom: []         # [{secretRef: {name: z-connectors}}]  (env: secret references)
  extraVolumes: []         # Secret volumes for file: secret references
  extraVolumeMounts: []
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

# Database migrations (`z-server migrate`, owner role).
#   hook:          a Job run as a pre-install,pre-upgrade hook. Needs the database reachable before install,
#                  so it needs an external Postgres and database.existingSecret.
#   initContainer: an init container of the z-server pod (single replica only). Used with the embedded
#                  Postgres, which does not exist yet when pre-install hooks run.
#   auto:          initContainer with postgres.embedded, hook otherwise.
migrate:
  mode: auto
  backoffLimit: 2
  activeDeadlineSeconds: 900
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

# Load packs into the catalog (`z-server seed`, idempotent) as a post-install,post-upgrade hook.
seed:
  enabled: true
  packs: /app/packs        # baked into the z-server image
  only: []                 # pack names; empty: all
  # On a first install with the embedded Postgres the seed may start before the migrations ran: retries
  # with exponential back-off cover that (~10 minutes).
  backoffLimit: 6
  activeDeadlineSeconds: 600

# --------------------------------------------------------------------------------------------------- runners
runners:
  # z-server starts one batch/v1 Job per agent job here (Z_EXECUTOR=kubernetes).
  namespace: z-runners
  createNamespace: true
  serviceAccountName: z-runner   # no token mounted (automountServiceAccountToken: false)
  image:
    repository: ghcr.io/k3e9x/z-runner
    tag: ""
    digest: ""             # REQUIRED when env=production (the server refuses a runner image without a digest)
  runtimeClassName: ""     # e.g. gvisor (Z_RUNNER_RUNTIME_CLASS); see README "gVisor"
  runtimeClass:
    create: false          # create a cluster-scoped RuntimeClass (needs runsc on every node)
    name: gvisor
    handler: runsc
  jobTTLSeconds: 3600      # Z_RUNNER_JOB_TTL_S: ttlSecondsAfterFinished of runner Jobs
  podSecurity:
    level: restricted      # Pod Security Admission enforce/audit/warn on the runner namespace
    version: latest
  resourceQuota:
    enabled: true
    hard:
      pods: "40"
      count/jobs.batch: "80"
      count/secrets: "100"
      requests.cpu: "16"
      requests.memory: 32Gi
      limits.cpu: "64"
      limits.memory: 96Gi
      limits.ephemeral-storage: 160Gi
  # The executor sets cpu 250m-2, memory 512Mi-2Gi, ephemeral-storage limit 3Gi per runner pod.
  limitRange:
    enabled: true
    default: { cpu: "2", memory: 2Gi, ephemeral-storage: 3Gi }
    defaultRequest: { cpu: 250m, memory: 512Mi, ephemeral-storage: 512Mi }
    max: { cpu: "4", memory: 8Gi, ephemeral-storage: 10Gi }
  networkPolicy:
    enabled: true
    # Ports runners may open on pods labelled z.io/runner-reachable=true in the release namespace
    # (z-server internal API + gateway, LiteLLM, egress proxy once it ships).
    reachablePorts: [8000, 4000]
    extraEgress: []        # extra NetworkPolicy egress rules (e.g. the egress proxy in another namespace)

# DNS for the runner egress policy (kube-dns/CoreDNS pods). k3s and most distributions label CoreDNS
# k8s-app=kube-dns in kube-system.
dns:
  namespace: kube-system
  podLabels:
    k8s-app: kube-dns

# --------------------------------------------------------------------------------------------------- z-ui
ui:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/k3e9x/z-ui
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------------------------- egress proxy
# The runners' only way out (docs/07): package mirrors from config.z.egress.mirrors (URLs or host names),
# everything else denied. Off by default: runners then reach only Z and LiteLLM.
egressProxy:
  enabled: false
  replicas: 1
  image:
    repository: ghcr.io/k3e9x/z-egress-proxy
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  port: 3128
  # Where the mirrors are (NetworkPolicy egress peers of the proxy, TCP 80/443). Empty: 0.0.0.0/0. Every
  # 0.0.0.0/0 peer (yours too) gets `except` for 169.254.0.0/16 (link-local, cloud metadata),
  # cluster.podCIDR, cluster.serviceCIDR and RFC 1918 (10/8, 172.16/12, 192.168/16). IPv4 only.
  egressTo: []             # e.g. [{ ipBlock: { cidr: 203.0.113.0/24 } }] to name the mirrors exactly
  # Private ranges the proxy may reach anyway (an internal mirror), each added as its own peer. Explicit opt-in:
  # never list a range that holds the cluster CIDRs.
  privateAllow: []         # e.g. [10.20.5.0/24]
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

# --------------------------------------------------------------------------------------------------- z-browser
# Gateway-side browser worker for `browser` connectors (docs/05 §1): replays reviewed flows in Chromium. Only
# z-server reaches it; it reaches only DNS and `egressTo` (the web apps of your browser connectors).
browser:
  enabled: false
  replicas: 1
  image:
    repository: ghcr.io/k3e9x/z-browser
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  port: 8090
  concurrency: 4           # flows at a time per replica (one Chromium context each)
  egressTo: []             # e.g. [{ ipBlock: { cidr: 10.20.0.0/16 } }]; empty: no app is reachable
  egressPorts: [443, 80]
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }

# --------------------------------------------------------------------------------------------------- LiteLLM
litellm:
  replicas: 1
  # Official proxy image pinned by digest (same reference as compose). Never 1.82.7 / 1.82.8
  # (security/blocked-versions.yaml).
  image:
    repository: docker.io/litellm/litellm
    tag: v1.105.0
    digest: sha256:60947db020b57e204823d3fbc8bb295c85be890d7c9adcc77fb4f5fc2fe410b2
    pullPolicy: IfNotPresent
  port: 4000
  runAsUser: 65534         # the image defaults to root; its Prisma engines are readable by any uid
  inferenceApiBase: ""     # INFERENCE_API_BASE: https://private.inferx.datax.iliad.fr/inference/v1 (key: secrets.inferenceApiKey)
  extraEnv: []
  extraEnvFrom: []
  resources:
    requests: { cpu: 250m, memory: 768Mi, ephemeral-storage: 256Mi }
    limits: { cpu: "2", memory: 2Gi, ephemeral-storage: 1Gi }
  tmpSizeLimit: 512Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --------------------------------------------------------------------------------------------------- Postgres
postgres:
  # Embedded single-instance Postgres 16 + pgvector (team server / dev). Production on shared clusters:
  # external Postgres or CloudNativePG (embedded: false + database.existingSecret).
  embedded: false
  image:
    repository: docker.io/pgvector/pgvector
    tag: pg16
    digest: sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    pullPolicy: IfNotPresent
  runAsUser: 999           # the image's postgres user
  storage:
    size: 20Gi
    storageClass: ""
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }

database:
  # External Postgres (postgres.embedded=false): REQUIRED. A Secret with three DSNs:
  #   DATABASE_URL          postgresql://z_app:...@host:5432/z      (application role, append-only audit)
  #   MIGRATE_DATABASE_URL  postgresql://z:...@host:5432/z          (owner role, migrations only)
  #   LITELLM_DATABASE_URL  postgresql://litellm:...@host:5432/litellm
  # Embedded Postgres: optional. Empty: the chart generates the passwords once and keeps them. Otherwise a
  # Secret with POSTGRES_PASSWORD (owner `z`), Z_APP_DB_PASSWORD and LITELLM_DB_PASSWORD (alphanumeric).
  existingSecret: ""
  keys:
    appUrl: DATABASE_URL
    migrateUrl: MIGRATE_DATABASE_URL
    litellmUrl: LITELLM_DATABASE_URL
  appRole: z_app           # Z_DB_APP_ROLE: the role migrations grant (no UPDATE/DELETE on the audit tables)
  embeddingDim: 1024       # Z_EMBEDDING_DIM: must match the z-embed model

# --------------------------------------------------------------------------------------------------- Secrets
secrets:
  # Name of an existing Secret with the keys Z_SECRET_KEY, LITELLM_MASTER_KEY, Z_METRICS_TOKEN (and
  # Z_BROWSER_TOKEN with browser.enabled) and optionally
  # OIDC_CLIENT_SECRET, INFERENCE_API_KEY. Empty: the chart creates `<fullname>-secrets` from the values below
  # (empty Z_SECRET_KEY / LITELLM_MASTER_KEY are generated once and kept across upgrades and uninstall).
  existingSecret: ""
  zSecretKey: ""
  litellmMasterKey: ""
  litellmSaltKey: ""       # encrypts LiteLLM's stored credentials (the inferX key set from Z); empty: generated once and kept
  oidcClientSecret: ""
  inferenceApiKey: ""
  metricsToken: ""         # bearer token for GET /metrics (empty: generated once and kept)
  browserToken: ""         # z-server -> z-browser (empty: generated once and kept); key Z_BROWSER_TOKEN
  # External Secrets Operator: render an ExternalSecret that writes the Secret `<fullname>-secrets` instead.
  externalSecret:
    enabled: false
    apiVersion: external-secrets.io/v1
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: ""
    data: []               # [{secretKey: Z_SECRET_KEY, remoteRef: {key: z/platform, property: secret_key}}]
    dataFrom: []

# --------------------------------------------------------------------------------------------------- storage
persistence:
  artifacts:
    enabled: true          # false: emptyDir (artifacts are lost when the pod goes)
    existingClaim: ""
    storageClass: ""
    accessModes: [ReadWriteOnce]
    size: 20Gi
    mountPath: /data/artifacts   # Z_ARTIFACTS_DIR

# --------------------------------------------------------------------------------------------------- traffic
ingress:
  enabled: true
  className: ""
  host: z.example.internal
  annotations: {}
  tls:
    enabled: true
    secretName: z-tls      # provided by cert-manager or created beforehand

# Gateway API instead of (or next to) the Ingress.
httpRoute:
  enabled: false
  apiVersion: gateway.networking.k8s.io/v1
  parentRefs: []           # [{name: shared-gateway, namespace: gateway-system, sectionName: https}]
  hostnames: []            # default: [ingress.host]
  annotations: {}

networkPolicy:
  # Ingress policies for the chart's pods in the release namespace, egress policies for z-server
  # (serverEgress) and LiteLLM (litellmEgress).
  enabled: true
  # Where the ingress controller / gateway pods run (traffic to z-ui, or z-server when ui.enabled=false).
  ingressController:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector: {}
  # Extra peers allowed to scrape z-server /metrics (Prometheus).
  metricsFrom: []          # [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]
  # Restrict LiteLLM egress to DNS (+ the embedded Postgres, + databaseEgress) and these rules (invariant 1/2:
  # models only through LiteLLM, external providers off). REQUIRED when env=production: the render fails
  # unless one rule has an ipBlock CIDR and ports (the inferX gateway); 0.0.0.0/0 and ::/0 are refused there.
  # Empty (other environments only): LiteLLM egress is not restricted.
  litellmEgress: []        # [{to: [{ipBlock: {cidr: 10.20.0.0/16}}], ports: [{port: 443, protocol: TCP}]}]
  # External Postgres (postgres.embedded=false): egress rules to the database, added to z-server and LiteLLM.
  databaseEgress: []       # [{to: [{ipBlock: {cidr: 10.30.0.10/32}}], ports: [{port: 5432, protocol: TCP}]}]
  # z-server egress. The chart always allows DNS and the chart pods z-server calls (LiteLLM, the embedded
  # Postgres, z-browser; not the egress proxy, which only runners use); everything outside the release is
  # listed here. Cannot be disabled when env=production.
  serverEgress:
    enabled: true
    # The Kubernetes API (the executor creates runner Jobs and Secrets). NetworkPolicy matches the API server
    # endpoints after the kubernetes Service is translated: control-plane / node IPs, port 6443 on k3s and
    # kubeadm (443 on most managed clusters). Narrow the CIDR to your control-plane addresses. On Cilium,
    # ipBlock does not select node IPs unless policy-cidr-match-mode=nodes is set (or add a
    # CiliumNetworkPolicy with toEntities: [kube-apiserver]).
    kubernetesApi:
      - to: [{ ipBlock: { cidr: 0.0.0.0/0 } }]
        ports: [{ port: 6443, protocol: TCP }]
    # Everything else z-server calls: the GitLab instance (OIDC issuer, and usually the GitLab connector),
    # the tool APIs of your connectors, chat/notification webhooks, audit forwarding (syslog, https),
    # INFERENCE_PROMETHEUS_URL. Empty: none of them is reachable (GitLab sign-in fails).
    allow: []              # [{to: [{ipBlock: {cidr: 10.10.0.0/16}}], ports: [{port: 443, protocol: TCP}]}]

podDisruptionBudget:
  enabled: false

metrics:
  serviceMonitor:
    enabled: false         # rendered only when the cluster serves monitoring.coreos.com/v1
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  # "Z overview" Grafana dashboard as a ConfigMap for the Grafana sidecar (dashboards/z-overview.json).
  grafanaDashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"

# --------------------------------------------------------------------------------------------------- config
config:
  # config/z.yaml (validated by the server against contracts/config.schema.json). ${VAR} placeholders are
  # filled from the z-server environment. executor.kubernetes is overridden by the Z_RUNNER_* env vars.
  z:
    workspace:
      name: Cyber Ops
      environment: kubernetes
    auth:
      provider: gitlab
      mode: ${Z_AUTH_MODE:-oidc}
      issuer_url: ${OIDC_ISSUER_URL}
      client_id: ${OIDC_CLIENT_ID}
      client_secret: ${OIDC_CLIENT_SECRET}
      scopes: [openid, profile, email]
      groups_claim: groups
      allowed_groups: [cyber]
      no_match: viewer
      group_mapping:
        - { group: cyber/z/z-admins, role: admin, scope: org }
        - { group: cyber/z/z-auditors, role: auditor, scope: org }
        - { group: cyber/z/z-builders, role: builder, scope: org }
        - { group: cyber/z/z-approvers, role: approver, scope: team }
        - { group: cyber/z/z-operators, role: operator, scope: team }
      team_mapping:
        - { group: cyber/soc-csirt, team: Cyber Ops }
        - { group: cyber/archi, team: Architecture }
      reevaluate_groups_minutes: 60
      session: { idle_minutes: 120, absolute_hours: 12, cli_token_days: 30 }
      step_up_max_age_s: 300
      api_tokens: { max_days: 90 }
      cli: { device_flow: true, loopback_redirect: "http://127.0.0.1:8765/callback" }
      local_accounts:
        bootstrap: { enabled: true, ttl_hours: 24 }
        password_policy: { min_length: 14, lockout_after: 5, lockout_minutes: 15 }
      breakglass: { enabled: false }
    audit:
      retention_days: 365
      checkpoint_minutes: 60
      forward:
        syslog: { enabled: false, url: "tls://syslog.example.internal:6514", format: rfc5424 }
        https: { enabled: false, url: "" }
    executor:
      kind: kubernetes
      kubernetes: { namespace: z-runners, service_account: z-runner, job_ttl_s: 3600 }
      tool_images: []    # cli connector tools (ADR 0025): name@sha256:..., pulled by the runners namespace
      default_concurrency: 8
      max_concurrency: 32
    inference:
      gateway_url: ${LITELLM_URL}
      aliases: [z-heavy, z-fast, z-judge, z-embed]
      prometheus:
        url: ${INFERENCE_PROMETHEUS_URL}
      probes: { models_poll_s: 60, tool_call_probe_s: 600 }
    providers:
      - { name: inferX, kind: internal, enabled: true, aliases: [z-heavy, z-fast, z-judge, z-embed], data_classes: [C0, C1, C2, C3] }
      - { name: Anthropic API, kind: external, enabled: false, aliases: [ext-claude], data_classes: [C0, C1] }
      - { name: Azure OpenAI, kind: external, enabled: false, aliases: [ext-azure], data_classes: [C0, C1] }
      - { name: Mistral API, kind: external, enabled: false, aliases: [ext-mistral], data_classes: [C0, C1] }
    routing_policy:
      data_classes: { C0: Public, C1: Internal, C2: Confidential, C3: Restricted }
      default_mission_class: C2
      external_fallback_when_degraded: false
      never_external: [C2, C3]
      never_in_memory: [C3]
    budgets:
      org_monthly_tokens: 600000000
      default_mission_tokens: 10000000
      alert_at: 0.8
    # docs/04 §6: the pattern scan always runs; the model stage (z-judge) can only raise its verdict and is
    # governed by the locked judge_injection_scan guardrail below. Same as config/z.example.yaml.
    judge:
      model: z-judge
      model_stage: true
      timeout_s: 8
    guardrails:
      human_approval_for_writes: { value: true, locked: true }
      two_approvers_for_destructive: { value: true, locked: true }
      sandbox_network: { value: deny, locked: true }
      judge_injection_scan: { value: true, locked: true }    # invariant 6: tool results are scanned
      learning_requires_approval: { value: true, locked: true }
      max_steps_per_job: 120
      max_job_minutes: 60
    egress:
      proxy_url: ${EGRESS_PROXY_URL}
      mirrors: []
      browser_targets: []
    secrets:
      backend: ${Z_SECRETS_BACKEND:-kubernetes}
      vault: { address: "", mount: kv, path_prefix: z/ }
    memory:
      embedding_dim: ${Z_EMBEDDING_DIM:-1024}
    retention:
      events_days: 180
      artifacts_days: 90
      c3_artifacts_days: 7
    learning:
      schedule: "0 2 * * *"
      shadow_replay_missions: 10
      max_token_cost_increase: 0.15
    ui:
      default_theme: night
      default_font: plex

  # config/litellm.yaml (see config/litellm.example.yaml and ADR 0024): inferX catalogue ids, pinned. The keys
  # come from the Secret. No model here may have an external fallback in inferX (C2/C3 data goes through them).
  litellm:
    model_list:
      - model_name: z-heavy
        litellm_params: { model: "openai/glm-5-3-nvfp4", api_base: os.environ/INFERENCE_API_BASE, litellm_credential_name: inferx }
        model_info: { provider_name: inferx, data_classes: [C0, C1, C2, C3] }
      - model_name: z-fast
        litellm_params: { model: "openai/qwen3-8-27b-nvfp4", api_base: os.environ/INFERENCE_API_BASE, litellm_credential_name: inferx }
        model_info: { provider_name: inferx, data_classes: [C0, C1, C2, C3] }
      - model_name: z-judge
        litellm_params: { model: "openai/qwen3-8-27b-nvfp4", api_base: os.environ/INFERENCE_API_BASE, litellm_credential_name: inferx }
        model_info: { provider_name: inferx, data_classes: [C0, C1, C2, C3] }
      - model_name: z-embed
        litellm_params: { model: "openai/<EMBEDDING_MODEL_ID>", api_base: os.environ/INFERENCE_API_BASE, litellm_credential_name: inferx }
        model_info: { mode: embedding, provider_name: inferx, data_classes: [C0, C1, C2, C3] }
    # The inferX key (ADR 0027): INFERENCE_API_KEY by default; an admin can replace it from Z (Inference → inferX
    # key), and LiteLLM then keeps it encrypted in its database (LITELLM_SALT_KEY), also across restarts.
    credential_list:
      - credential_name: inferx
        credential_values: { api_key: os.environ/INFERENCE_API_KEY }
        credential_info: { description: inferX project key (environment default) }   # required by LiteLLM
    litellm_settings:
      drop_params: true
      request_timeout: 600
      return_response_headers: true
      callbacks: [z_inference_guard.guard]   # files/z_inference_guard.py, shipped in the LiteLLM ConfigMap
    router_settings:
      num_retries: 2
      retry_after: 1
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/LITELLM_DATABASE_URL
