# Z on Docker Compose (docs/11 §1): postgres, litellm, z-server, z-ui (web on :8080), docker-socket-proxy.
# Optional: egress-proxy (`--profile egress`) for package mirrors. z-browser comes later.
#   cp .env.example .env && cp config/litellm.example.yaml config/litellm.yaml && cp config/z.example.yaml config/z.yaml
#   docker compose -f deploy/compose/docker-compose.yml up -d
name: z

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:${PGVECTOR_DIGEST:-7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a}
    environment:
      POSTGRES_USER: z
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      Z_APP_DB_PASSWORD: ${Z_APP_DB_PASSWORD:?set Z_APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-z.sh:ro
    networks: [core]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U z -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  litellm:
    # Official proxy image pinned by digest. Never LiteLLM 1.82.7 / 1.82.8 (security/blocked-versions.yaml).
    image: litellm/litellm:v1.105.0@sha256:60947db020b57e204823d3fbc8bb295c85be890d7c9adcc77fb4f5fc2fe410b2
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      LITELLM_DATABASE_URL: postgresql://z:${POSTGRES_PASSWORD}@postgres:5432/litellm
      DATABASE_URL: postgresql://z:${POSTGRES_PASSWORD}@postgres:5432/litellm
      INFERENCE_API_BASE: ${INFERENCE_API_BASE:-}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
      STORE_MODEL_IN_DB: "False"
    volumes:
      - ../../config/litellm.yaml:/etc/litellm/config.yaml:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [core, runners]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 30
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  z-migrate:
    build:
      context: ../..
      dockerfile: deploy/images/z-server/Dockerfile
      secrets: [extra_ca]
    image: z-server:local
    command: ["migrate"]
    environment:
      DATABASE_URL: postgresql://z:${POSTGRES_PASSWORD}@postgres:5432/z   # owner role: migrations only
      Z_EMBEDDING_DIM: ${Z_EMBEDDING_DIM:-1024}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [core]
    <<: *hardening
    restart: "no"

  docker-socket-proxy:
    # The only path to the Docker API: runner containers only, hardening checked on every create (invariant 13).
    build:
      context: ../..
      dockerfile: deploy/images/z-socket-proxy/Dockerfile
    image: z-socket-proxy:local
    environment:
      Z_RUNNER_IMAGES: ${Z_RUNNER_IMAGE:-z-runner:local}
      Z_RUNNER_NETWORK: z_runners
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add: ["${DOCKER_GID:-0}"]   # group owning the Docker socket on the host
    networks: [core]
    <<: *hardening

  z-server:
    image: z-server:local
    command: ["all", "--port", "8000"]
    env_file: [../../.env]
    environment:
      DATABASE_URL: postgresql://z_app:${Z_APP_DB_PASSWORD}@postgres:5432/z   # application role
      LITELLM_URL: http://litellm:4000
      Z_CONFIG: /etc/z/z.yaml
      Z_RUNNER_IMAGE: ${Z_RUNNER_IMAGE:-z-runner:local}
    volumes:
      - ../../config/z.yaml:/etc/z/z.yaml:ro
      - artifacts:/data/artifacts
    tmpfs: ["/tmp:size=64m"]
    ports: ["127.0.0.1:${Z_API_PORT:-8000}:8000"]   # CLI and API on the host; browsers use z-ui
    depends_on:
      z-migrate: { condition: service_completed_successfully }
      litellm: { condition: service_healthy }
      docker-socket-proxy: { condition: service_healthy }
    networks: [edge, core, runners]
    <<: *hardening

  egress-proxy:
    # The runners' only way out: package mirrors in Z_EGRESS_MIRRORS, everything else denied (docs/07).
    # Start it with `--profile egress` and set EGRESS_PROXY_URL=http://egress-proxy:3128 for the runners.
    profiles: [egress]
    build:
      context: ../..
      dockerfile: deploy/images/egress-proxy/Dockerfile
    image: z-egress-proxy:local
    environment:
      EGRESS_ALLOW: ${Z_EGRESS_MIRRORS:-}   # the proxy refuses to start when empty
    tmpfs: ["/tmp:size=32m,uid=13,gid=13"]
    networks: [runners, egress]
    <<: *hardening

  z-ui:
    # The web app (unprivileged nginx, uid 101): static files, /api and SSE proxied to z-server.
    build:
      context: ../..
      dockerfile: deploy/images/z-ui/Dockerfile
      secrets: [extra_ca]
    image: z-ui:local
    environment:
      Z_SERVER_UPSTREAM: z-server:8000
      Z_UI_PORT: "8080"
    tmpfs: ["/tmp:size=16m,uid=101,gid=101"]
    ports: ["127.0.0.1:${Z_PORT:-8080}:8080"]
    depends_on:
      z-server: { condition: service_started }
    networks: [edge]
    <<: *hardening

secrets:
  extra_ca:
    file: ${Z_EXTRA_CA:-/dev/null}   # CA bundle of a TLS-intercepting proxy, if any (build time only)

volumes:
  pgdata: {}
  artifacts: {}

networks:
  edge: {}
  core: {}
  runners:
    name: z_runners
    internal: true
  egress: {}
