# Template — build, scan, SBOM, sign and push images. Runs on main and tags only.
name: images
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to GHCR
      id-token: write          # cosign keyless + provenance
      attestations: write
    strategy:
      matrix:
        image: [z-server, z-runner, z-browser, z-ui]
    steps:
      - uses: actions/checkout@v4                 # pin SHA
        with: { persist-credentials: false }
      - uses: docker/setup-qemu-action@v3         # pin SHA
      - uses: docker/setup-buildx-action@v3       # pin SHA
      - uses: docker/login-action@v3              # pin SHA
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5           # pin SHA
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern=v{{version}}
      - id: build
        uses: docker/build-push-action@v6         # pin SHA
        with:
          context: .
          file: deploy/images/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: mode=max
          sbom: true
      - run: ./ci/scripts/install-scanners.sh
      - name: Scan image
        run: trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
      - name: SBOM
        run: syft ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }} -o spdx-json > sbom.spdx.json
      - uses: sigstore/cosign-installer@v3        # pin SHA
      - name: Sign and attest
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          cosign sign --yes "$IMG"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMG"
