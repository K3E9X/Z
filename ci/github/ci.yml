# Template — copied to .github/workflows/ci.yml in BUILD phase A. B8 pins every `uses:` to a commit SHA
# (Renovate keeps them updated; zizmor fails the build on unpinned actions).
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4            # pin SHA
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@v6          # pin SHA
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy server runner cli packages
      - run: uv run pytest --cov=server --cov=runner --cov-fail-under=80
      - run: uv run python -m z_common.contracts.validate_examples
      - run: uv run python -m z_common.packs.lint packs/

  ui:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ui } }
    steps:
      - uses: actions/checkout@v4            # pin SHA
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4           # pin SHA
      - uses: actions/setup-node@v4          # pin SHA
        with: { node-version: 22, cache: pnpm, cache-dependency-path: ui/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test -- --run && pnpm build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4            # pin SHA
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Install scanners (pinned versions, checksums verified)
        run: ./ci/scripts/install-scanners.sh   # gitleaks, semgrep, osv-scanner, trivy, zizmor, hadolint — versions + sha256 in ci/scripts/versions.lock
      - run: gitleaks detect --redact --no-banner
      - run: semgrep scan --error --config p/python --config p/typescript --config p/dockerfile --config p/kubernetes --config p/secrets
      - run: osv-scanner scan --lockfile uv.lock --lockfile ui/pnpm-lock.yaml
      - run: trivy fs --exit-code 1 --severity HIGH,CRITICAL --ignorefile security/trivyignore .
      - run: trivy config --exit-code 1 --severity HIGH,CRITICAL deploy/
      - run: zizmor --min-severity medium .github/workflows/
      - run: hadolint deploy/images/*/Dockerfile
      - run: uv run python ci/scripts/check_exceptions.py security/exceptions.yaml   # fails on expired exceptions
