<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Z — Command palette</title>

</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif&amp;display=swap">
<style>
body{margin:0}
[data-font="plex"]{--sans:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;--display:'IBM Plex Sans',ui-sans-serif,sans-serif;--display-w:500;--display-ls:-0.025em}
[data-font="inter"]{--sans:'Inter',ui-sans-serif,system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--display:'Inter',ui-sans-serif,sans-serif;--display-w:600;--display-ls:-0.035em}
[data-font="editorial"]{--sans:'Inter',ui-sans-serif,system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--display:'Newsreader',Georgia,serif;--display-w:400;--display-ls:-0.015em}
[data-font="geist"]{--sans:'Geist',ui-sans-serif,system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace;--display:'Instrument Serif',Georgia,serif;--display-w:400;--display-ls:0}
[data-theme="night"]{--bg:#0C0C0B;--panel:#121211;--raised:#1A1A18;--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.13);--text:#EDECE8;--text-2:#A9A79F;--text-3:#8B8981;--inv-bg:#EDECE8;--inv-text:#0C0C0B;--run:#6AA6FF;--wait:#E7B04A;--ok:#5DBE8A;--err:#F07067;--scrim:rgba(0,0,0,.6)}
[data-theme="day"]{--bg:#F7F7F5;--panel:#FFFFFF;--raised:#F1F1EE;--line:rgba(20,20,18,.08);--line-2:rgba(20,20,18,.15);--text:#171715;--text-2:#5A5953;--text-3:#6F6D66;--inv-bg:#171715;--inv-text:#FFFFFF;--run:#1F5FD1;--wait:#9A5B00;--ok:#1C7A4A;--err:#B92B27;--scrim:rgba(20,20,18,.28)}
[data-theme="slate"]{--bg:#0D1015;--panel:#12161D;--raised:#1A1F28;--line:rgba(200,215,255,.08);--line-2:rgba(200,215,255,.15);--text:#E4E9F1;--text-2:#A2ACBB;--text-3:#8792A3;--inv-bg:#E4E9F1;--inv-text:#0D1015;--run:#74AEFF;--wait:#E7B04A;--ok:#5DBE8A;--err:#F07067;--scrim:rgba(0,0,0,.6)}
[data-theme="contrast"]{--bg:#000000;--panel:#000000;--raised:#161616;--line:rgba(255,255,255,.30);--line-2:rgba(255,255,255,.60);--text:#FFFFFF;--text-2:#E2E2E2;--text-3:#C9C9C9;--inv-bg:#FFFFFF;--inv-text:#000000;--run:#8CC2FF;--wait:#FFD166;--ok:#7EE2A8;--err:#FF8F87;--scrim:rgba(0,0,0,.75)}
a{color:var(--text)}a:hover{color:var(--text-2)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
::placeholder{color:var(--text-3)}
</style>

<div data-theme="night" data-font="plex" style="min-height: 100vh; position: relative; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow: hidden">

  <div aria-hidden="true" style="position: absolute; inset: 0; display: flex">
    <div style="width: 248px; border-right: 1px solid var(--line); background: var(--panel)"></div>
    <div style="flex: 1; padding: 88px 40px; display: flex; flex-direction: column; gap: 18px">
      <div style="width: 320px; height: 36px; border-radius: 6px; background: var(--raised)"></div>
      <div style="width: 460px; height: 14px; border-radius: 4px; background: var(--raised)"></div>
      <div style="height: 1px; background: var(--line); margin-top: 24px"></div>
      <div style="height: 44px; border-radius: 8px; background: var(--raised)"></div>
      <div style="height: 44px; border-radius: 8px; background: var(--raised); opacity: 0.6"></div>
      <div style="height: 44px; border-radius: 8px; background: var(--raised); opacity: 0.4"></div>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--scrim)"></div>

  <div role="dialog" aria-modal="true" aria-label="Command palette" style="position: relative; box-sizing: border-box; width: min(680px, calc(100% - 32px)); margin: 120px auto 0; border: 1px solid var(--line-2); border-radius: 14px; background: var(--panel); box-shadow: 0 32px 80px rgba(0,0,0,.45); overflow: hidden">
    <div style="display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line)">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#F25C2A"></rect><path d="M7.5 7.5h9l-9 9h9" fill="none" stroke="#0C0C0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <label for="cmd" style="position: absolute; left: -9999px">Ask Z or search</label>
      <input id="cmd" value="triage critical vulns" style="flex: 1; border: none; background: none; outline: none; font-size: 16px">
      <kbd style="font-family: var(--mono); font-size: 11px; color: var(--text-3); border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 6px">esc</kbd>
    </div>

    <div style="padding: 8px; display: flex; flex-direction: column; gap: 2px; max-height: 520px; overflow: auto">
      <div style="padding: 8px 10px 4px; font-size: 12px; color: var(--text-3)">Ask Z</div>
      <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 9px; border: none; background: var(--raised); text-align: left">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        <span style="flex: 1">New mission: “triage critical vulns”</span>
        <kbd style="font-family: var(--mono); font-size: 11px; color: var(--text-3)">↵</kbd>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 9px; border: none; background: none; text-align: left">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 4.5h10.5a3 3 0 0 1 3 3v12H8a3 3 0 0 1-3-3z"></path><path d="M5 16.5a3 3 0 0 1 3-3h10.5"></path></svg>
        <span style="flex: 1">Run playbook: Weekly vulnerability triage</span>
        <span style="font-size: 12px; color: var(--text-3)">Playbook</span>
      </button>

      <div style="padding: 12px 10px 4px; font-size: 12px; color: var(--text-3)">Agents</div>
      <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 9px; border: none; background: none; text-align: left">
        <span style="width: 22px; height: 22px; border-radius: 11px; border: 1px solid var(--line-2); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600">VA</span>
        <span style="flex: 1">Vuln Analyst</span>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--wait)"><span style="width: 6px; height: 6px; border-radius: 3px; background: var(--wait)"></span>waiting for you</span>
      </button>

      <div style="padding: 12px 10px 4px; font-size: 12px; color: var(--text-3)">Missions</div>
      <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 9px; border: none; background: none; text-align: left">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="3"></circle></svg>
        <span style="flex: 1">Triage this week's critical findings</span>
        <span style="font-family: var(--mono); font-size: 12px; color: var(--text-3)">20/23</span>
      </button>

      <div style="padding: 12px 10px 4px; font-size: 12px; color: var(--text-3)">Actions</div>
      <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 9px; border: none; background: none; text-align: left">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        <span style="flex: 1">Review the 3 Jira tickets from Vuln Analyst</span>
        <kbd style="font-family: var(--mono); font-size: 11px; color: var(--text-3)">G I</kbd>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 9px; border: none; background: none; text-align: left">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M9 6v12M15 6v12"></path></svg>
        <span style="flex: 1">Pause all agents</span>
        <kbd style="font-family: var(--mono); font-size: 11px; color: var(--text-3)">⇧ P</kbd>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 9px; border: none; background: none; text-align: left">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 3.5v17A8.5 8.5 0 0 0 12 3.5z" fill="currentColor"></path></svg>
        <span style="flex: 1">Switch theme</span>
        <span style="font-size: 12px; color: var(--text-3)">Night · Day · Slate · Contrast</span>
      </button>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 10px 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-3)"><span><kbd style="font-family: var(--mono)">↑ ↓</kbd> move</span><span><kbd style="font-family: var(--mono)">↵</kbd> open</span><span><kbd style="font-family: var(--mono)">⌘↵</kbd> run in background</span></div>
  </div>
</div>


</body>
</html>
